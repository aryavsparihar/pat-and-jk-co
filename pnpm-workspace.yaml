allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# A package version must have been published for a week before pnpm will install it, so a
# hijacked release is usually found and pulled before it reaches us (in minutes)
minimumReleaseAge: 10080

# Pull transitive dependencies up to patched releases. Each line names the advisory it answers;
# remove one once the package that brings it in ships the fix itself (check with `pnpm why`).
overrides:
  # Admin code editor (monaco-editor): GHSA-p98j-92pf-mc4p
  dompurify: ">=3.4.16"
  # Build tooling
  esbuild: ">=0.25.0"
  # payload: DoS, TLS validation bypass and cookie disclosure advisories fixed in 7.29.1
  "undici@>=7.0.0 <7.29.1": "^7.29.1"
  # payload → ajv: host case normalisation, fixed in 3.1.8
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"
  # eslint → minimatch (development only): DoS via nested braces
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  # sharp (images: uploads, Next's optimiser): librsvg flaw in SVG decoding, GHSA-wq5f-xc86-pv6w
  "sharp@<0.35.5": "0.35.5"
  # postcss and the bundler (build time): event-loop DoS from crafted source maps, GHSA-68fv-2mgg-jv7q
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"

# Advisories that cannot be fixed yet, each with why it does not reach the site and a date to look
# again. CI fails on any other high or critical advisory (.github/workflows/security.yml). The same
# list, for Trivy, is in .trivyignore.yaml.
auditConfig:
  ignoreGhsas:
    # braces 3.0.3, through chokidar in sass (file watching at build time): stack overflow on
    # deeply nested glob patterns. No fixed version exists; it only ever matches globs from our
    # own build configuration, never anything a visitor sends. Review 2026-12-01
    - GHSA-vfj7-8cjw-p6xm

# Small fixes to packages, until their authors make them. Each patch says why inside. When the
# package is updated the patch must still apply, or the install fails and says so.
#   @vercel/blob: report upload progress from XHR in browsers, which counts bytes actually sent,
#   rather than from a streamed fetch, which races ahead of the network
patchedDependencies:
  '@vercel/blob@2.8.0': patches/@vercel__blob@2.8.0.patch
