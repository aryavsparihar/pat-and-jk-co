# Weekly version updates, grouped so a quiet week is one pull request rather than twenty.
# Security updates are separate and immediate once enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      next-react:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      development:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Major versions are deliberate upgrades, not chores
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Payload is upgraded by hand, every package at once. Each @payloadcms package pins `payload`
      # to an exact version, which Dependabot cannot resolve as a group: it proposed a lone
      # `payload` bump that would not install. Security alerts still arrive in the Security tab.
      - dependency-name: 'payload'
      - dependency-name: '@payloadcms/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
