# Version updates, grouped so each costs one CI run (docs/ARCHITECTURE.md, "CI minutes"): one pull
# request a month for every npm package, and one a month for every GitHub Action. Dependabot cannot
# put the two ecosystems in one pull request. Security updates are separate and immediate once
# enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly: each of these pull requests costs a full CI run, and a weekly one used about 150 of
    # the month's minutes. Security updates do not wait for this
    schedule:
      interval: monthly
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    versioning-strategy: increase
    # A release must be a week old before it is proposed: hijacked releases are usually found and
    # pulled within days. Security updates are not held back by this
    cooldown:
      default-days: 7
    groups:
      # Everything in one pull request: Next.js and React, development tools and production
      # patches alike. Majors are left out below, as deliberate upgrades
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Major versions are deliberate upgrades, not chores
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Payload is upgraded by hand, every package at once. Each @payloadcms package pins `payload`
      # to an exact version, which Dependabot cannot resolve as a group: it proposed a lone
      # `payload` bump that would not install. Security alerts still arrive in the Security tab.
      - dependency-name: 'payload'
      - dependency-name: '@payloadcms/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      monthly:
        patterns: ['*']
