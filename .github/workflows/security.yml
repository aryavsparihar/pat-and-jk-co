# Security checks on every push and pull request, and weekly, so an advisory published about a
# dependency we already use is noticed without waiting for a change. Each job is a required check
# on main (docs/SECURITY.md, "The gatekeeper"). Every action is pinned to a full commit, and every
# tool is a pinned release whose checksum is checked before it runs.
#
# Minutes are budgeted (docs/ARCHITECTURE.md, "CI minutes"). The secret scan runs every time: it
# takes seconds and reads the whole history. The dependency and code scans run when code or
# dependencies changed (the scope job, as in CI) and every Monday in full; otherwise they report
# success under their names without running, as the ruleset and Vercel need them to report.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays, 08:30 in India

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # The self-hosted Mac when CI_RUNS_ON names it, else GitHub's runners; Dependabot's pull
    # requests always on GitHub's (ci.yml, docs/ARCHITECTURE.md "CI minutes")
    runs-on: ${{ fromJSON((github.event.pull_request.user.login || github.actor) != 'dependabot[bot]' && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/scope.sh Security

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: tested-tree.txt
          retention-days: 30

  secrets:
    name: Secret scan
    # The self-hosted Mac when CI_RUNS_ON names it, else GitHub's runners; Dependabot's pull
    # requests always on GitHub's (ci.yml, docs/ARCHITECTURE.md "CI minutes")
    runs-on: ${{ fromJSON((github.event.pull_request.user.login || github.actor) != 'dependabot[bot]' && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed later was still committed

      # On the Mac, the copy installed there (Homebrew), only if it is exactly this version
      - name: gitleaks, every commit
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -sSfL -o gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
            tar -xzf gitleaks.tar.gz gitleaks
            GITLEAKS=./gitleaks
          else
            GITLEAKS=$(command -v gitleaks)
            [ "$($GITLEAKS version)" = "8.30.1" ] || { echo "::error::The Mac needs gitleaks 8.30.1"; exit 1; }
          fi
          $GITLEAKS git --redact --no-banner --exit-code 1 .

  dependencies:
    name: Dependency, secret and config scan
    needs: scope
    # Runs even if the scope job broke: then nothing says "skip", so everything runs
    if: ${{ !cancelled() }}
    # The self-hosted Mac when CI_RUNS_ON names it, else GitHub's runners; Dependabot's pull
    # requests always on GitHub's (ci.yml, docs/ARCHITECTURE.md "CI minutes")
    runs-on: ${{ fromJSON((github.event.pull_request.user.login || github.actor) != 'dependabot[bot]' && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - if: needs.scope.outputs.heavy == 'false'
        run: echo "No code or dependency changed (see the scope job), so this passes without running."

      - if: needs.scope.outputs.heavy != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.scope.outputs.heavy != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Each job its own copy: on the Mac two runners share a home folder, and two jobs installing
        # pnpm into the default ~/setup-pnpm at once break each other
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - if: needs.scope.outputs.heavy != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Known advisories that cannot be fixed yet are listed, with reasons, in pnpm-workspace.yaml
      - if: needs.scope.outputs.heavy != 'false'
        name: pnpm audit, high and critical
        run: pnpm audit --audit-level high

      - if: needs.scope.outputs.heavy != 'false'
        name: Install Trivy
        # On the Mac, the copy installed there (Homebrew), only if it is exactly this version
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -sSfL -o trivy.tar.gz \
              https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
            echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tar.gz" | sha256sum -c -
            tar -xzf trivy.tar.gz trivy
          else
            trivy --version | grep -qx 'Version: 0.75.0' || { echo "::error::The Mac needs Trivy 0.75.0"; exit 1; }
            ln -sf "$(command -v trivy)" trivy
          fi

      # Dependencies, secrets in the working tree, and configuration (workflows, vercel.json,
      # next.config). Anything that cannot be fixed must be listed in .trivyignore.yaml with a
      # reason and a date to look again; past that date it fails here until someone does
      - if: needs.scope.outputs.heavy != 'false'
        name: Trivy, high and critical
        run: |
          ./trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml --exit-code 1 --skip-dirs node_modules .

      - if: needs.scope.outputs.heavy != 'false'
        name: Software bill of materials (CycloneDX)
        run: ./trivy fs --format cyclonedx --output sbom.cdx.json --skip-dirs node_modules .

      - if: needs.scope.outputs.heavy != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  code:
    name: Code scan (Semgrep)
    needs: scope
    # Runs even if the scope job broke: then nothing says "skip", so everything runs
    if: ${{ !cancelled() }}
    # The self-hosted Mac when CI_RUNS_ON names it, else GitHub's runners; Dependabot's pull
    # requests always on GitHub's (ci.yml, docs/ARCHITECTURE.md "CI minutes")
    runs-on: ${{ fromJSON((github.event.pull_request.user.login || github.actor) != 'dependabot[bot]' && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - if: needs.scope.outputs.heavy == 'false'
        run: echo "No code or dependency changed (see the scope job), so this passes without running."

      - if: needs.scope.outputs.heavy != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Injection, unsafe HTML, weak crypto and the like, in our own code. CodeQL needs GitHub
      # Advanced Security on a private repository; Semgrep's community rules need no account.
      # Findings reviewed as safe carry a nosemgrep comment saying why. pnpm's release-age setting
      # lives in pnpm-workspace.yaml, where the .npmrc rule cannot see it.
      - if: needs.scope.outputs.heavy != 'false'
        name: Semgrep
        run: |
          # On the Mac, the copy installed there with pipx, only if it is exactly this version
          if [ "$(semgrep --version 2>/dev/null)" != "1.180.0" ]; then
            pipx install --force semgrep==1.180.0
          fi
          semgrep scan --metrics=off --error \
            --config p/default --config p/typescript --config p/nextjs --config p/react \
            --exclude node_modules --exclude src/migrations --exclude src/payload-types.ts \
            --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
            .
